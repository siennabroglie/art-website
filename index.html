<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sienna Broglie</title>
</head>
<body>
    <h1>Sienna Broglie</h1>
    <div class="menu-buttons">
        <button onclick="window.location.href=''">CV</button>
        <button onclick="window.location.href=''">Artist Statement</button>
        <button onclick="window.location.href='./pages/writings.html'">Writings</button>
        <button onclick="window.location.href='./pages/contact.html'">Contact</button>
    </div>
    <div class="image-container">
        <figure>
            <img class="scaled clickable-image" src="./images/siennaBroglie_YOch+NapY+UltB+CadR.jpg" alt="(6x4)(4x7) Yellow Ocher, Napthol Yellow Light, Ultramarine Blue, Cadmium Red. Oil on Paper. 24 x 28 cm.">
            <figcaption>(6x4)(4x7) Yellow Ocher, Napthol Yellow Light, Ultramarine Blue, Cadmium Red. Oil on Paper. 24 x 28 cm.</figcaption>
        </figure>
        <figure>
            <img class="scaled clickable-image" src="./images/siennaBroglie_CadR+CadY+W.jpg" alt="(4x4)(6x5) Cadmium Red, Cadmium Yellow. Oil on Paper. 24 x 20 cm.">
            <figcaption>(4x4)(6x5) Cadmium Red, Cadmium Yellow. Oil on Paper. 24 x 20 cm.</figcaption>
        </figure>
    </div>
    <script>
        const images = document.querySelectorAll('.clickable-image');

        images.forEach(image => {
            image.addEventListener('click', function() {
                this.classList.toggle('enlarged');
            });
        });
    </script>
    <div class="standard">
        <button onclick="window.location.href='./pages/archive.html'">Archive</button>
    </div>
</body>
</html>
