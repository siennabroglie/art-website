<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sienna Broglie</title>
</head>
<body class="work">
    <h2>sienna broglie</h1>
    <div class="menu-buttons">
        <!-- <button class="work" onclick="window.location.href='./documents/siennaBroglie_cv.pdf'">cv</button> -->
        <!-- <button class="work" onclick="window.location.href=''">artist statement</button> -->
        <!-- <button class="work" onclick="window.location.href='./pages/writings.html'">writings</button> -->
        <button class="work" onclick="window.location.href='./pages/info.html'">info</button>
    </div>
    <h1 class="invisible">Sienna Broglie Artwork</h1>
    <div class="image-container">
        <figure>
            <img class="scaled clickable-image shadow" src="./images/siennaBroglie_(ultramarineB, naplesY, ochreY, azoR).jpg" alt="(ultramarineB, naplesY, ochreY, azoR)((6^18)*6!)(4^28) = (5.27*10^33), 2026, Oil on Paper, 24 x 28 cm.">
            <figcaption>(ultramarineB, naplesY, ochreY, azoR)(6<sup>18</sup>*6!)(4<sup>28</sup>) = (5.27*10<sup>33</sup>)<br>2026<br>Oil on Paper<br>24 x 28 cm.</figcaption>
        </figure>
        <figure>
            <img class="scaled clickable-image shadow" src="./images/siennaBroglie_(cadmiumR, cadmiumY).jpg" alt="(cadmiumR, cadmiumY)((6^10)*6!)(4^30) = (5.02*10^28), 2026, Oil on Paper, 24 x 20 cm.">
            <figcaption>(cadmiumR, cadmiumY)(6<sup>10</sup>*6!)(4<sup>30</sup>) = (5.02*10<sup>28</sup>)<br>2026<br>Oil on Paper<br>24 x 20 cm.</figcaption>
        </figure>
        <figure>
            <img class="scaled clickable-image shadow" src="./images/siennaBroglie_(cadmiumY, cadmiumO, vanDykeBr).jpg" alt="(cadmiumY, cadmiumO, vanDykeBr)((6^14)*6!)(4^15) = (6.06*10^22), 2026, Oil on Paper, 15 x 20 cm.">
            <figcaption>(cadmiumY, cadmiumO, vanDykeBr)(6<sup>14</sup>*6!)(4<sup>15</sup>) = (6.06*10<sup>22</sup>)<br>2026<br>Oil on Paper<br>15 x 20 cm.</figcaption>
        </figure>
    </div>
    <script>
        const images = document.querySelectorAll('.clickable-image');

        images.forEach(image => {
            image.addEventListener('click', function() {
                this.classList.toggle('enlarged');
            });
        });
    </script>
    <div class="standard">
        <button class="work" onclick="window.location.href='./pages/archive.html'">archive</button>
         <button class="work" onclick="window.location.href='./pages/sketchbook.html'">sketchbook</button>
    </div>
</body>
</html>
