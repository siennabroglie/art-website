<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sienna Broglie</title>
</head>
<body>
    <h1>Sienna Broglie</h1>
    <div class="menu-buttons">
        <button>CV</button>
        <a href=""></a>
        <button>Artist Statement</button>
        <a href=""></a>
        <button>Essays</button>
        <a href="./pages/essays.html"></a>
        <button>Contact</button>
        <a href="./pages/contact.html"></a>
    </div>
    <div class="image-container">
        <figure>
            <img class="scaled clickable-image" src="./images/siennaBroglie_YOch+NapY+UltB+CadR.jpg" alt="(6x4)(4x7) Yellow Ocher, Napthol Yellow Light, Ultramarine Blue, Cadmium Red. Oil on Paper. 24 x 28 cm.">
            <figcaption>(6x4)(4x7) Yellow Ocher, Napthol Yellow Light, Ultramarine Blue, Cadmium Red. Oil on Paper. 24 x 28 cm.</figcaption>
        </figure>
        <figure>
            <img class="scaled clickable-image" src="./images/siennaBroglie_CadR+CadY+W.jpg" alt="(4x4)(6x5) Cadmium Red, Cadmium Yellow. Oil on Paper. 24 x 20 cm.">
            <figcaption>(4x4)(6x5) Cadmium Red, Cadmium Yellow. Oil on Paper. 24 x 20 cm.</figcaption>
        </figure>
    </div>
    <script>
        const images = document.querySelectorAll('.clickable-image');

        images.forEach(image => {
            image.addEventListener('click', function() {
                this.classList.toggle('enlarged');
            });
        });
    </script>
    <div>
        <button>Archive</button>
        <a href="./pages/archive.html"></a>
    </div>
    <div class="standard">
        <form id="email-form">
            <label>Email List</label>
            <p>Every few months, new paintings and essays.</p>
            <input type="text" placeholder="email address" name="email" id="email">
            <input type="submit" value="Subscribe"></input>
        </form>
    </div>
    <div id="response-message"></div>
    <script>
        const form = document.getElementById('email-form');
        const responseMessage = document.getElementById('response-message');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const scriptURL = 'https://script.google.com/macros/s/AKfycbxdk7gcJB9ZP72Q2zbtLE38D4VvC12ZfFypO5H1pYulHud2YDajFIKQPt50U_HmV4r2/exec';
            const formData = new FormData(form);

            responseMessage.textContent = 'Submitting...';

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        responseMessage.textContent = 'Success. Your email was added to my list.';
                        form.reset();
                    } else {
                        throw new Error('Form submission failed');
                    }
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    responseMessage.textContent = 'An error occurred. Please try again.';
                });
        })
    </script>
</body>
</html>
