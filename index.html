<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sienna Broglie</title>
</head>
<body class="work">
    <h2>sienna broglie</h1>
    <div class="menu-buttons">
        <button class="work" onclick="window.location.href=''">cv</button>
        <button class="work" onclick="window.location.href=''">artist statement</button>
        <!-- <button class="work" onclick="window.location.href='./pages/writings.html'">writings</button> -->
        <button class="work" onclick="window.location.href='./pages/contact.html'">contact</button>
    </div>
    <h1 class="invisible">Sienna Broglie Artwork</h1>
    <div class="image-container">
        <figure>
            <img class="scaled clickable-image" src="./images/siennaBroglie_YOch+NapY+UltB+CadR.jpg" alt="(6x4)(4x7) Yellow Ocher, Napthol Yellow Light, Ultramarine Blue, Cadmium Red. 2026. Oil on Paper. 24 x 28 cm.">
            <figcaption>(6x4)(4x7) Yellow Ocher, Napthol Yellow Light, Ultramarine Blue, Cadmium Red. 2026. Oil on Paper. 24 x 28 cm.</figcaption>
        </figure>
        <figure>
            <img class="scaled clickable-image" src="./images/siennaBroglie_CadR+CadY+W.jpg" alt="(4x4)(6x5) Cadmium Red, Cadmium Yellow. 2026. Oil on Paper. 24 x 20 cm.">
            <figcaption>(4x4)(6x5) Cadmium Red, Cadmium Yellow. 2026. Oil on Paper. 24 x 20 cm.</figcaption>
        </figure>
    </div>
    <script>
        const images = document.querySelectorAll('.clickable-image');

        images.forEach(image => {
            image.addEventListener('click', function() {
                this.classList.toggle('enlarged');
            });
        });
    </script>
    <div class="standard">
        <button class="work" onclick="window.location.href='./pages/archive.html'">archive</button>
         <button class="work" onclick="window.location.href='./pages/sketchbook.html'">sketchbook</button>
    </div>
</body>
</html>
