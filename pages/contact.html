<body>

        <button onclick="window.location.href='../index.html'">work</button>
        <button onclick="window.location.href='../documents/siennaBroglie_cv.pdf'">cv</button>

    </div>
    <h1>cont<!-- ignore -->act</h1>
    <div class="standard">
        <p>siennabroglie<!-- ignore -->@<!-- ignore -->gmail.com</p>
        <p>(443)<!-- ignore --> 995-<!-- ignore -->1633</p>
        <p>@<!-- ignore -->snn_<!-- ignore -->uh</p>
        <p>Montana, USA</p>
        </div>
    <div class="standard">
        <form id="email-form">
            <label>Keep in touch</label>
            <p>Every few months I'll send photos.</p>
            <input type="text" placeholder="email address" name="email" id="email">
            <input type="submit" value="submit"></input>
        </form>
    </div>
    <div id="response-message"></div>
    <script>
        const form = document.getElementById('email-form');
        const responseMessage = document.getElementById('response-message');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const scriptURL = 'https://script.google.com/macros/s/AKfycbxdk7gcJB9ZP72Q2zbtLE38D4VvC12ZfFypO5H1pYulHud2YDajFIKQPt50U_HmV4r2/exec';
            const formData = new FormData(form);

            responseMessage.textContent = 'Submitting...';

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        responseMessage.textContent = 'Success. Your email was added to my list.';
                        form.reset();
                    } else {
                        throw new Error('Form submission failed');
                    }
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    responseMessage.textContent = 'An error occurred. Please try again.';
                });
        })
    </script>
</body>
